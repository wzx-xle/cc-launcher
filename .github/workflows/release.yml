name: release

# 触发条件：
#   - tag push（v*）——正式发版
#   - workflow_dispatch ——手动触发，用于 dry-run / 测试
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # 创建 release 所需

jobs:
  build:
    name: build (${{ matrix.target.os }}-${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe 需要完整历史（虽然我们这里直接用 tag 名，但保留习惯）

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'

      - name: build
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          set -euo pipefail
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          out="dist/cc-launcher-${GOOS}-${GOARCH}${ext}"

          # 移植 build.sh version_ldflags 语义：
          #   main.Version   = tag 名（如 v0.10.0；workflow_dispatch 触发时 fallback 到 "dev"）
          #   main.Commit    = commit 短 hash
          #   main.BuildTime = ISO 8601 UTC
          version="${GITHUB_REF_NAME:-dev}"
          if [ -z "${version}" ] || [ "${version}" = "main" ]; then
            version="dev"
          fi
          commit="${GITHUB_SHA::8}"
          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ldflags="-s -w -X main.Version=${version} -X main.Commit=${commit} -X main.BuildTime=${build_time}"

          go build -ldflags="${ldflags}" -o "${out}" ./cmd/cc-launcher/
          echo "==> built: ${out}"

      - name: zip (windows only)
        if: matrix.target.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist

          # zip 内文件命名约定（scoop manifest 的 bin 字段依赖此约定）：
          #   cc-launcher.exe  —— 主可执行
          #   ccl.cmd          —— ccl 命令 shim（项目原生命令名是 ccl，不是 cc-launcher）
          #   README.md / LICENSE —— 元信息
          cp "cc-launcher-${{ matrix.target.os }}-${{ matrix.target.arch }}.exe" "cc-launcher.exe"
          cp ../README.md ./README.md
          cp ../LICENSE ./LICENSE

          # ccl.cmd shim：把 `ccl` 命令转发到 `cc-launcher.exe`
          # 这是 wrapper 不是二进制；用 cmd 的 %~dp0 取自身目录，绝对路径避免 PATH 干扰
          cat > ccl.cmd <<'EOF'
          @echo off
          "%~dp0cc-launcher.exe" %*
          EOF

          zip "cc-launcher-${{ matrix.target.os }}-${{ matrix.target.arch }}.zip" \
              "cc-launcher.exe" "ccl.cmd" "README.md" "LICENSE"

          # 清理中间产物，只留 zip + 单 exe
          rm "cc-launcher.exe" "ccl.cmd" "README.md" "LICENSE"
          ls -la

      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cc-launcher-${{ matrix.target.os }}-${{ matrix.target.arch }}.exe
            dist/cc-launcher-${{ matrix.target.os }}-${{ matrix.target.arch }}.zip
          fail_on_unmatched_files: false
