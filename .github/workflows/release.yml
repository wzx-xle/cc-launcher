name: release

# 触发条件：
#   - tag push（v*）——正式发版
#   - workflow_dispatch ——手动触发，默认 dry-run（只构建 + 校验，不碰 release）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run：只构建 + 校验（CHANGELOG 段提取 / zip hash），不创建或修改 release'
        type: boolean
        default: true
      version:
        description: 'dry-run 时用于校验的版本号（留空 = 取 CHANGELOG.md 里最新的版本段）'
        type: string
        default: ''

permissions:
  contents: write  # 创建 release 所需

jobs:
  build:
    name: build (${{ matrix.target.os }}-${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    env:
      # dry-run 判定：只有手动触发且勾了 dry_run 才算 dry-run。
      # tag push 永远是真实发版（DRY_RUN=false）。
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: windows, arch: amd64 }
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe 需要完整历史（虽然我们这里直接用 tag 名，但保留习惯）

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'

      - name: build
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          set -euo pipefail
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          out="dist/cc-launcher-${GOOS}-${GOARCH}${ext}"

          # 移植 build.sh version_ldflags 语义：
          #   main.Version   = tag 名（如 v0.10.0；workflow_dispatch 触发时 fallback 到 "dev"）
          #   main.Commit    = commit 短 hash
          #
          # 注：原 -X main.BuildTime= 已移除（BuildTime 每次 build 注入当前时间让
          # 二进制 byte-level 不可重现，导致 zip hash 跨环境无法对齐）。
          # -trimpath 剥离 GOMODCACHE 等 build 机器路径，让本机 build.sh bump-scoop
          # 与 CI release workflow 出 byte-level 一致的 zip。**不是** ldflags 的一部
          # 分（Go 1.21+ link 器拒绝）——放在 go build 命令行。
          version="${GITHUB_REF_NAME:-dev}"
          if [ -z "${version}" ] || [ "${version}" = "main" ]; then
            version="dev"
          fi
          commit="${GITHUB_SHA::8}"
          ldflags="-s -w -X main.Version=${version} -X main.Commit=${commit}"

          go build -trimpath -ldflags="${ldflags}" -o "${out}" ./cmd/cc-launcher/
          echo "==> built: ${out}"

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          cd dist

          OS="${{ matrix.target.os }}"
          ARCH="${{ matrix.target.arch }}"
          bare="cc-launcher-${OS}-${ARCH}"

          if [ "$OS" = "windows" ]; then
            # ---- Windows: zip 含 ccl.cmd shim + README + LICENSE ----
            # zip 内文件命名约定（scoop manifest 的 bin 字段依赖此约定）：
            #   cc-launcher.exe  —— 主可执行
            #   ccl.cmd          —— ccl 命令 shim（项目原生命令名是 ccl，不是 cc-launcher）
            #   README.md / LICENSE —— 元信息
            cp "${bare}.exe" "cc-launcher.exe"
            cp ../README.md ./README.md
            cp ../LICENSE ./LICENSE

            # ccl.cmd shim：把 `ccl` 命令转发到 `cc-launcher.exe`
            # 这是 wrapper 不是二进制；用 cmd 的 %~dp0 取自身目录，绝对路径避免 PATH 干扰
            #
            # 字节来自 cmd/release-notes（单一来源，与本机 build.sh 共用）→
            # 行尾是 **CRLF**（.cmd 是 cmd.exe 读的批处理文件，Windows 惯例；
            # 之前这里是 bash heredoc 写的 LF，且从未在真 Windows 上验证过）。
            # go run 需要在 module 内 → 当前 cwd 是 dist/，用 ../ 前缀。
            go run ../cmd/release-notes windows-shim > ccl.cmd

            # 固定 4 个源文件 mtime 到 epoch 0 + 用 UTC 打包 + 剥 NTFS extra field：
            # 三个变量统一后，本机 build.sh bump-scoop 同样处理，hash byte-level 一致
            # （避免 CI 时区 / 100ns mtime 精度让本机 hash 算不准）。
            touch -d @0 cc-launcher.exe ccl.cmd README.md LICENSE
            TZ=UTC zip -X "${bare}.zip" \
                "cc-launcher.exe" "ccl.cmd" "README.md" "LICENSE"

            # 清理中间产物，只留 zip + 单 exe
            rm "cc-launcher.exe" "ccl.cmd" "README.md" "LICENSE"
            ls -la
          else
            # ---- Linux/Darwin: tar.gz 含 cc-launcher (chmod +x) + README + LICENSE ----
            stage=$(mktemp -d)
            cp "${bare}" "$stage/cc-launcher"
            cp ../README.md ../LICENSE "$stage/"
            chmod +x "$stage/cc-launcher"

            # 固定 3 个源文件 mtime 到 epoch 0 + tar 归档（保持 hash 可重现）
            touch -d @0 "$stage"/*
            tar -C "$stage" -czf "${bare}.tar.gz" \
                --owner=0 --group=0 --numeric-owner \
                cc-launcher README.md LICENSE

            rm -rf "$stage"
            ls -la
          fi

      - name: upload release assets
        # 资产上传放在 body 注入步骤**之前**:资产是 release 的核心产出,body
        # (CHANGELOG 段 + hash marker)只是展示层。v0.14.0 实测因为 body 注入
        # 步骤 404 失败 → job 中断 → 本步骤没执行 → Windows zip 没挂上。
        # 放在前面后,body 注入再失败也只影响 body,不影响资产。
        #
        # softprops/action-gh-release 行为:release 不存在则创建;已存在则 update,
        # 且 **body 用 `workflowBody || existingReleaseBody`**(本 action 未传 body
        # 输入 → workflowBody 为空 → 保留已有 body)→ 其它 matrix job 后续 update
        # 不会把 windows-amd64 job 注入的 CHANGELOG 段/hash marker 冲掉。
        #
        # dry-run(手动触发)跳过:不产生任何 release / 资产。
        if: ${{ env.DRY_RUN != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cc-launcher-${{ matrix.target.os }}-${{ matrix.target.arch }}.zip
            dist/cc-launcher-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz
          fail_on_unmatched_files: false

      - name: ensure release exists (body 注入的前置条件)
        # race 修复(v0.14.0 实测踩到): release 由各 matrix job 末尾的
        # softprops/action-gh-release 步骤创建——**谁先跑完谁创建**。而
        # windows-amd64 job 的 body 注入步骤跑在上传步骤**之前**,假设 release
        # 已存在 → 其它 4 个 job 还没跑完时 `gh release edit` / `gh api` 直接
        # 404 → job 失败 → 连累后面的 "upload release assets" 步骤不执行 →
        # **Windows zip 挂不到 release 上**(v0.14.0 实测:release 只有 4 个
        # tar.gz,缺 cc-launcher-windows-amd64.zip,body 空)。
        #
        # 这里显式保证 release 存在,后续注入步骤不再依赖 job 间执行顺序。
        # --verify-tag:tag 必须已存在(避免 gh 在 tag 缺失时指向默认分支建 tag)。
        if: matrix.target.os == 'windows' && matrix.target.arch == 'amd64' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $VERSION 已存在"
            exit 0
          fi
          echo "release $VERSION 不存在,先创建(body 注入依赖它存在)"
          if ! gh release create "$VERSION" \
              --repo "${{ github.repository }}" \
              --title "$VERSION" \
              --notes "" \
              --verify-tag; then
            # 并发场景:其它 matrix job 可能刚创建了 → 409/422 可忽略
            echo "WARNING: gh release create 失败(可能已被其它 job 并发创建),继续" >&2
            gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null
          fi

      - name: inject CHANGELOG [v0.X.Y] section to release body
        # release-notes-changelog-injection: 让 GitHub release 页面用户视觉
        # 看到 CHANGELOG 段(而非仅 hidden hash marker)。从仓库根 CHANGELOG.md
        # 提取 `## [0.X.Y]` 段(H2 + 后续内容到下一个 ## [ 之前),用
        # gh release edit --notes 写入(--notes 接 string inline;CHANGELOG
        # 段 inline 远 < 64KB 命令行上限,不需要 file 形式)。
        # 仅 windows-amd64 跑(与 hash append step 同一 job,顺序执行,
        # 保证最终 body = CHANGELOG 段 + 空行 + hash marker)。
        #
        # v0.14.0 修 regex bug:VERSION 来自 github.ref_name = "v0.14.0"(带 v),
        # 旧正则 `## \[v?` + version 只能匹配 `## [v0.14.0]`,而本仓 CHANGELOG
        # 标题是 `## [0.14.0]` → **永远匹配不上** → v0.12.0 ~ v0.14.0 的
        # CHANGELOG 注入全部静默 skip(用户打开 release 页面看不到任何内容)。
        # 现在先剥掉 version 的前导 "v",`v?` 保留 → `## [0.14.0]` 与
        # `## [v0.14.0]` 两种写法都命中。
        #
        # 提取不到段落 → **fail**(不再静默 skip):静默 skip 正是上面那个 bug
        # 藏了三个版本的原因。CHANGELOG.md 文件本身不存在 → 仍然 warning+skip
        # (没有 CHANGELOG 的仓库发版不该被卡住)。
        if: matrix.target.os == 'windows' && matrix.target.arch == 'amd64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ ! -f CHANGELOG.md ]; then
            echo "WARNING: CHANGELOG.md not found at repo root, skip changelog inject" >&2
            exit 0
          fi
          # 提取逻辑走 internal/release 的 Go 实现（cmd/release-notes CLI）——
          # 那份实现有单测（internal/release/notes_test.go），CI 的 `go test ./...`
          # 会覆盖。此前这里内联 python，零测试覆盖，2026-10-21 连续踩了
          # "版本前缀不匹配"（静默 skip 三个版本）+ "缺行首锚点误匹配正文"两个 bug。
          # 行为约定见 internal/release/notes.go:
          #   - 版本号带不带 "v" 都认（"v0.14.0" == "0.14.0"）
          #   - 只认**行首**的 H2 标题（正文里出现的字面量不会被误当标题）
          #   - 段落到下一个 H2 之前（含全部 H3 子段）
          #   - 找不到 → 非零退出（不静默 skip）
          TARGET_VERSION="$VERSION"
          if [ -n "$INPUT_VERSION" ]; then
            # 显式指定版本：dry-run 用它校验；临时 tag 的全链路烟测也用它
            # （临时 tag 如 v0.0.0-ci.xxx 在 CHANGELOG 里没有对应段）
            TARGET_VERSION="$INPUT_VERSION"
          elif [ "$DRY_RUN" = "true" ]; then
            # dry-run: ref_name 通常是分支名(main)→ 用 CHANGELOG 最新版本做校验
            TARGET_VERSION=$(go run ./cmd/release-notes changelog-latest CHANGELOG.md)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "==> DRY-RUN: 校验 CHANGELOG 段提取（版本 $TARGET_VERSION），不写 release body"
          fi
          CHANGELOG_SECTION=$(go run ./cmd/release-notes changelog-section CHANGELOG.md "$TARGET_VERSION")
          if [ -z "$CHANGELOG_SECTION" ]; then
            echo "ERROR: extracted CHANGELOG section for $TARGET_VERSION is empty" >&2
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "==> 将写入的 CHANGELOG 段（$(printf '%s' "$CHANGELOG_SECTION" | wc -c) 字符）:"
            printf '%s\n' "$CHANGELOG_SECTION" | head -10
            echo "..."
            exit 0
          fi
          gh release edit "$VERSION" \
              --repo "${{ github.repository }}" --notes "$CHANGELOG_SECTION"
          LINE_COUNT=$(printf '%s\n' "$CHANGELOG_SECTION" | wc -l)
          echo "injected CHANGELOG [$VERSION] section ($LINE_COUNT lines) to release body"

      - name: append windows zip SHA256 to release body
        # bumb-scoop-hash-trace change: 让 build.sh bump-scoop 不下载 zip 拿 hash
        # (下载流量高)。release workflow 在 windows-amd64 job 末尾算 zip SHA256,
        # 用 HTML 注释形式写进 release body。
        # build.sh bump-scoop 用 curl GitHub releases API fetch body + parse hash,
        # 避免下载 18 MB zip。
        # 仅 windows-amd64 跑 (zip 只在 windows-amd64 job 产生;其他 matrix 4 个 job
        # 不重复写)。
        # release-notes-changelog-injection:marker 格式从
        # `<!-- sha256:auto-hash:HEX -->` 改为 `<!-- sha256:cc-launcher-windows-amd64.zip:HEX -->`,
        # 文件名替换 `auto-hash` token,build.sh regex 同步改通用格式
        # `sha256:[^:]+:\K[a-f0-9]{64}` 兼容新旧 marker。
        if: matrix.target.os == 'windows' && matrix.target.arch == 'amd64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          HASH=$(sha256sum cc-launcher-windows-amd64.zip | awk '{print $1}')
          echo "windows zip SHA256: $HASH"
          if [ "$DRY_RUN" = "true" ]; then
            echo "==> DRY-RUN: 校验 hash 计算（不写 release body）"
            echo "    将追加的 marker: <!-- sha256:cc-launcher-windows-amd64.zip:${HASH} -->"
            exit 0
          fi
          BODY=$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
              --jq '.body // ""')
          # 保留已有 body (CHANGELOG 段由上一个 step 注入),append marker
          NEW_BODY="${BODY}

          <!-- sha256:cc-launcher-windows-amd64.zip:${HASH} -->"
          gh release edit "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" --notes "$NEW_BODY"
          echo "appended sha256 marker to release ${{ github.ref_name }} body"
